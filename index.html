</style></head><body><header class="topbar"><a class="wordmark" aria-label="neutralbasis" href="#funding">neutral<span>basis</span></a><nav aria-label="Ana menü"><a href="#exchanges" data-page="exchanges">Borsalar</a><a href="#multi" data-page="multi">Çoklu paper</a><a href="#funding" data-page="funding">Funding arb</a><a href="#price" data-page="price">Fiyat arb</a><a href="#reports" data-page="reports">Performans</a><a href="#backtest" data-page="backtest">Backtest</a><a href="#scanner" data-page="scanner">Risk motoru</a><a href="#connections" data-page="connections">API’ler</a><a href="#settings" data-page="settings">Ayarlar</a></nav><div class="top-right"><input id="global-search" class="nav-search" aria-label="Varlık veya DEX ara" placeholder="Varlık, DEX, çift  /"><a href="#settings" class="nav-settings">Ayarlar <span class="muted" id="nav-period">8H</span> · <span class="muted" id="nav-size">$1,000</span> ▾</a><span class="tag">PAPER</span></div></header><div class="paper-strip"><div class="strip-left"><span><i class="dot"></i><span id="connection">BAĞLANIYOR</span></span><span>DEX + CEX / PUBLIC VERİ</span><span id="paper-state">OTOMATİK PAPER</span></div><span id="cycle-status">Veriler hazırlanıyor…</span></div><main id="app"></main><footer class="footer"><span><b style="color:#b7c4ad">neutralbasis</b> · perpetual arbitrage terminal</span><span>Public API verileri · sanal işlemler · UTC+3</span></footer><script>window.paperToken='__TOKEN__';const app=document.getElementById('app');let state=null,selectedAsset=null,selectedLong=null,tab='scanner',notice='',fetching=false;
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=x=>x==null?'—':Number(x).toLocaleString('en-US',{style:'currency',currency:'USD',minimumFractionDigits:2,maximumFractionDigits:2});
const pct=x=>x==null?'—':(x*100).toFixed(4)+'%';const ts=x=>x?new Date(x*1000).toLocaleString('tr-TR',{timeZone:'Europe/Istanbul'}):'—';
function line(k,v,cls=''){return `<div class="detail-line"><span class="muted">${esc(k)}</span><b class="mono ${cls}">${esc(v)}</b></div>`}
async function action(path,body={}){try{const r=await fetch('/api/'+path,{method:'POST',headers:{'Content-Type':'application/json','X-Paper-Token':window.paperToken},body:JSON.stringify(body)});const v=await r.json();if(!r.ok||v.ok===false)throw Error(v.error||v.message||'Bağlantı testi başarısız');notice=v.message||'İşlem kaydedildi.';if(path.startsWith('connections/')){const r=await fetch('/api/connections');if(state)state.connections=await r.json()}await refresh();render()}catch(e){notice=e.message;render()}}
function navigate(p){tab=p.replace('/','')||'scanner';location.hash=tab;render()}
function stats(){const bals=Object.values(state.balances),cash=bals.reduce((s,b)=>s+b.cash,0),equity=bals.reduce((s,b)=>s+b.equity,0),margin=bals.reduce((s,b)=>s+b.margin,0);return `<div class="stats">${[['Paper özkaynak',money(equity),'Başlangıç '+money(state.config.capital)],['Günlük net PnL',money(state.daily_pnl),'İstanbul günü · açık pozisyon dahil'],['Kullanılan marjin',money(margin),'Serbest '+money(equity-margin)],['Açık pozisyon',state.positions.length,'Limit '+state.config.max_positions+' · tümü sanal']].map(a=>`<div class="stat"><span class="muted">${a[0]}</span><div class="value">${a[1]}</div><small>${a[2]}</small></div>`).join('')}</div>`}
function head(title,sub){return `<div class="heading"><div><div class="tiny">GERÇEK PİYASA VERİSİ / SANAL İŞLEM</div><h1>${title}</h1><p class="muted">${sub}</p></div><div><span class="tag ${state.running?'':'warn'}">${state.running?'OTOMATİK PAPER':'GİRİŞLER DURAKLATILDI'}</span><button class="${state.running?'':'primary'}" style="margin-left:10px" onclick="action('${state.running?'pause':'start'}')">${state.running?'Yeni girişleri durdur':'Otomatik paper başlat'}</button></div></div>${notice?`<p role="status" class="reason">${esc(notice)}</p>`:''}${state.error?`<p class="reason bad">Veri hatası: ${esc(state.error)}. Yeni giriş yok; son değerler eski olabilir.</p>`:''}${state.pending_funding?'<p class="reason bad">Funding uzlaştırması bekleniyor. Eksik ödeme veya ödeme anı fiyatı yüzünden yeni girişler engelli.</p>':''}`}
function detail(c){if(!c)return '<div class="card detail"><h2>Veri hazırlanıyor</h2><p class="muted">Eşlenmiş 30 günlük mumlar ve funding geçmişi doğrulanıyor.</p></div>';return `<div class="card detail" style="display:block"><div class="tiny">SEÇİLİ ADAY</div><h2 style="margin:12px 0">${esc(c.asset)}</h2><div class="legs"><div class="leg"><span class="direction">LONG</span><b>${esc(c.long||'—')}</b><p class="mono">${pct(c.rate_long)} /1h</p></div><div class="leg"><span class="direction short">SHORT</span><b>${esc(c.short||'—')}</b><p class="mono">${pct(c.rate_short)} /1h</p></div></div>${line('Her bacak yaklaşık',money(c.size))}${line('Brüt notional',money(c.gross))}${line('Baz varlık miktarı',c.qty==null?'—':c.qty.toFixed(8))}${line('Oran korunursa funding',money(c.projected))}${line('24s ortalamasıyla sınırlı funding',money(c.conservative_funding))}${line('Giriş + çıkış ücretleri',c.entry_fee==null?'—':money(c.entry_fee+c.exit_fee))}${line('Defter + ek slippage maliyeti',money(c.execution_drag))}${line('Spread + teminat stres kaybı',money(c.stress_loss))}${line('Stres sonrası net tahmin',money(c.net),c.net>0?'good':'bad')}${line('Tahmini risk / bütçe',money(c.loss)+' / '+money(state.config.risk))}${c.analysis?`${line('Korelasyon · 24s / 7g',c.analysis.corr24.toFixed(3)+' / '+c.analysis.corr7.toFixed(3))}${line('Hedge beta / z-score',c.analysis.beta.toFixed(3)+' / '+c.analysis.z.toFixed(2))}${line('Eşlenmiş 1h mum',c.analysis.candles)}`:''}<div class="reason ${c.eligible?'':'bad'}">${c.eligible?'✓ Taramada koşullar geçti. Bot girişten önce defteri yeniden doğrular.':esc((c.reasons||[]).join(' · '))}</div><p class="tooltip">${esc(c.funding_basis||'Eksik veri varsa işlem açılmaz.')}<br>Stres geçmiş örneklerden hesaplanır; gelecekteki kaybı sınırlayan bir garanti değildir.</p></div>`}
function scanner(){let list=state.candidates;let c=list.find(c=>c.asset===selectedAsset&&c.long===selectedLong)||list[0];return head('Otomatik paper terminali','Gerçek fiyatlarla tara → riskini ölç → sanal aç → izle → koşullara göre kapat.')+stats()+`<div class="layout"><div class="card"><div class="card-head"><h2>Fırsatlar · ${list.length} yönlü aday</h2><span class="muted">Stres sonrası net sıralaması</span></div><div class="filters"><span class="tag">${state.config.symbols.length} varlık · Lighter / Extended</span><span class="tooltip">Her ${state.config.poll_seconds} sn · son tamamlanan ${ts(state.last_cycle)}</span></div><div class="table-wrap"><table><thead><tr><th>VARLIK / LONG → SHORT</th><th>FUNDING TAHMİNİ</th><th>SPREAD STRESİ</th><th>NET TAHMİN</th><th>KARAR</th></tr></thead><tbody>${list.map((r,i)=>`<tr tabindex="0" class="${r===c?'selected':''}" onclick="selectCandidate(${i})" onkeydown="if(event.key==='Enter')selectCandidate(${i})"><td><b>${esc(r.asset)}</b><div class="tooltip">${esc(r.long||'—')} → ${esc(r.short||'—')}</div></td><td class="mono">${money(r.conservative_funding)}</td><td class="mono">${money(r.stress_loss)}</td><td class="mono ${r.net>0?'good':'bad'}">${money(r.net)}</td><td><span class="tag ${r.eligible?'':'warn'}">${r.eligible?'Giriş adayı':'Bekle'}</span><div class="tooltip" style="white-space:normal;max-width:230px">${esc((r.reasons||[])[0]||'Girişte tekrar doğrulanacak')}</div></td></tr>`).join('')}</tbody></table>${list.length?'':'<div class="empty">İlk veri taraması devam ediyor. Uygun fırsat yoksa bot işlem açmaz.</div>'}</div><div class="table-foot">Giriş ufku ${state.config.horizon} saat · sabit tutma zorunluluğu yok · kâr garantisi yok</div></div>${detail(c)}</div>`+venues()}
function selectCandidate(i){const c=state.candidates[i];selectedAsset=c.asset;selectedLong=c.long;render()}
function venues(){return `<div class="venues">${Object.entries(state.platforms).map(([v,s])=>`<div class="venue"><b>${esc(v)}</b><span class="${s.ok?'good':'muted'}">${s.ok?'● Veri erişilebilir':'○ İşlem dışı'}</span><p class="tooltip" style="margin-top:8px">${esc(s.message)}</p></div>`).join('')}</div><p class="tooltip" style="margin:18px 0">${esc(state.valuation)}</p>`}
function positions(){return head('Paper pozisyonları','Sanal dolumlar, gerçek piyasa hareketleri ve uzlaştırılmış funding kayıtları.')+stats()+`<div class="card"><div class="card-head"><h2>Açık pozisyonlar · ${state.positions.length}</h2></div>${state.positions.length?state.positions.map(p=>`<div style="padding:20px;border-bottom:1px solid var(--line)"><h2>${esc(p.asset)} <span class="tag warn">${esc(p.status)}</span></h2>${p.legs.map(l=>line(l.venue+' '+l.side,l.qty+' @ '+l.entry.toFixed(5)+(l.closed?' · kapalı':''))).join('')}${line('Açılış',ts(p.opened))}${line('Son fiyatlama',ts(p.last_mark))}${line('Fiyat PnL · çıkış defteri',money(p.price_pnl_open))}${line('Paper funding · tahmini değerleme dahil',money(p.funding))}${line('Tahmini mark ile hesaplanan funding',money(p.estimated_funding))}${line('Ödenmiş sanal ücret',money(p.fees))}${line('Şimdi kapanırsa net',money(p.net_if_closed))}${line('Kalan avantaj tahmini',money(p.remaining_net_estimate))}<button onclick="action('close',{id:'${p.id}'})">Paper pozisyonu kapat</button><p class="tooltip" style="margin-top:10px">Veri yokken kapanış uydurulmaz. Talep sonraki taramada defterle yürütülür; bacak başarısız olursa kurtarma durumuna geçer.</p></div>`).join(''):'<div class="empty">Henüz açık paper pozisyon yok. Bot yalnızca tüm kontrolleri geçen fırsatta açar.</div>'}</div><div class="card" style="margin-top:20px"><div class="card-head"><h2>Kapanan işlemler</h2></div><div class="table-wrap"><table><thead><tr><th>VARLIK</th><th>KAPANIŞ</th><th>FİYAT PNL</th><th>FUNDING</th><th>ÜCRET</th><th>NET</th><th>NEDEN</th></tr></thead><tbody>${state.closed.slice().reverse().map(p=>`<tr><td>${esc(p.asset)}</td><td>${ts(p.closed_at)}</td><td>${money(p.price_pnl)}</td><td>${money(p.funding)}</td><td>${money(p.fees)}</td><td class="${p.net>=0?'good':'bad'}">${money(p.net)}</td><td style="white-space:normal">${esc(p.close_reason)}${p.pending_funding?.length?' · funding bekleniyor':''}</td></tr>`).join('')}</tbody></table></div></div>`}
const fields=[['capital','Başlangıç sermayesi · USD',10,1000000,1],['size','Hedef notional / bacak',10,100000,1],['leverage','Azami kaldıraç',1,5,1],['risk','İşlem kayıp bütçesi · USD',.01,1000,.01],['daily_loss','Günlük kayıp limiti · USD',.01,10000,.01],['reserve','Platform başına marjin rezervi',.3,.9,.01],['horizon','Funding tahmin ufku · saat',1,72,1],['min_net','Stres sonrası asgari net · USD',.01,1000,.01],['min_corr','Asgari 24s / 7g korelasyon',.8,1,.01],['poll_seconds','Tarama aralığı · saniye',15,300,1],['extra_slippage_bps','Defter fiyatına ek slippage · bp',0,50,.1],['collateral_stress_bps','USD/USDC teminat stresi · bp',0,100,.1],['lighter_fee','Lighter taker ücret kesri',.00028,.01,.00001],['extended_fee','Extended taker ücret kesri',.00025,.01,.00001]];
function settings(){return head('Paper ayarları','İlk sermaye iki platforma eşit ayrılır. Platformlar arasında anlık marjin aktarımı varsayılmaz.')+`<div class="card"><form id="config-form" class="formgrid">${fields.map(([k,l,min,max,step])=>`<label>${l}<input type="number" name="${k}" value="${state.config[k]}" min="${min}" max="${max}" step="${step}" required ${k==='capital'&&(state.positions.length||state.closed.length)?'disabled':''}></label>`).join('')}<div class="wide"><button type="submit" class="primary">Ayarları kaydet</button><p class="tooltip" style="margin-top:15px">Lighter ücret modeli Premium/Advanced taker üstünden muhafazakâr 0,028%; Extended crypto taker 0,025%. Hesaba özgü indirimler modellenmez. Giriş sonrası sermaye değiştirilemez. Tahmin ufku sabit kapanış süresi değildir.</p></div></form></div>`+venues()}
function logs(){return head('Karar ve funding günlüğü','Gerçekleşen oran ile gelecek ödeme tahmini birbirine karıştırılmaz.')+`<div class="card"><div class="card-head"><h2>Paper funding ödemeleri</h2><a href="/api/audit-export" target="_blank">Kayıtları JSON olarak aç ↗</a></div>${state.payments.length?state.payments.map(e=>`<div style="padding:12px 18px;border-bottom:1px solid var(--line)">${ts(e.ts)} · ${esc(e.body.venue)} ${esc(e.body.asset)} · ${money(e.body.cash)}<p class="tooltip">${e.body.unverified?'Borsa bu saatin oranını yayımlamadı; doğrulanmamış 0 tutar. Oran sonradan gelirse güncellenir':(e.body.valuation_estimated?'Resmî gerçekleşen oran × ödeme öncesi gözlenen mark; tutar tahmini':'Resmî gerçekleşen birim ödeme × sanal miktar')+' · kaynak kayıt #'+e.body.audit_id}</p></div>`).join(''):'<div class="empty">Henüz ödeme yok. Pozisyon ödeme anında açık olmalı; resmî kayıt gelmeden ödeme yazılmaz.</div>'}</div><div class="card" style="margin-top:20px"><div class="card-head"><h2>Son kararlar</h2></div><div style="max-height:600px;overflow:auto">${state.events.map(e=>`<div style="padding:12px 18px;border-bottom:1px solid var(--line)"><span class="tag warn">${esc(e.kind)}</span> <span class="tooltip">${ts(e.ts)}</span><p style="margin-top:6px">${esc(e.body.message||((e.body.asset||'')+' '+(e.body.long||'')+' → '+(e.body.short||'')))}</p><p class="tooltip">${esc((e.body.reasons||[]).join(' · '))}</p></div>`).join('')}</div></div>`}
function connections(){return head('Platform API bağlantıları','Resmî piyasa API adresleri hazır. Bağlantı testi gerçek emir göndermez.')+`<div class="card"><div class="card-head"><h2>Tarama listesi · 15 varlık / 30 yön</h2></div><form id="symbols-form" style="padding:20px"><label class="muted" for="symbols-list">Virgülle ayırarak tam 15 ortak perpetual varlık girin</label><input id="symbols-list" name="symbols" style="width:100%;margin:12px 0" value="${esc(state.config.symbols.join(', '))}" required><button class="primary" type="submit">15'li listeyi kaydet</button><p class="tooltip" style="margin-top:10px">${esc(state.config.symbols.join(' · '))}<br>Paper motoru şu an Lighter ↔ Extended çiftlerini kullanır. Diğer bağlantılar veri erişimi kontrolüdür.</p></form></div><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:18px;margin-top:20px">${Object.entries(state.connections||{}).map(([v,c])=>`<section class="card"><div class="card-head"><h2>${esc(v)}</h2><span class="tag ${c.paper?'':'warn'}">${c.paper?'PAPER ADAPTÖRÜ BAĞLI':'YALNIZCA VERİ TESTİ'}</span></div><div style="padding:20px"><label class="tiny">RESMÎ PİYASA API'Sİ</label><input aria-label="${esc(v)} API adresi" readonly value="${esc(c.url)}" style="width:100%;margin:10px 0"><p class="tooltip">${esc(c.auth)}</p><p style="margin:12px 0">${esc(c.note)}</p><button data-connection="${esc(v)}" onclick="testConnection(this)">Public bağlantıyı test et</button> <a class="tooltip" href="${esc(c.docs)}" target="_blank" rel="noopener">Resmî doküman ↗</a><div class="reason ${c.test?.ok?'':'muted'}">${c.test?esc(c.test.message)+'<br>'+ts(c.test.ts)+(c.test.markets?' · '+c.test.markets+' piyasa':''):'Henüz bağlantı testi yapılmadı.'}</div>${v==='Extended'?`<form id="extended-key-form"><label for="extended-key">İsteğe bağlı salt okunur API anahtarı</label><input id="extended-key" type="password" autocomplete="off" name="key" style="width:100%;margin:10px 0" placeholder="${c.has_key?'Kayıt var; değiştirmek için yeni anahtar':'Extended API anahtarını buraya girin'}" minlength="8" maxlength="2048" required><button type="submit">Doğrula ve bağla</button>${c.has_key?'<button type="button" onclick="action(\'connections/retest-key\')">Kayıtlı anahtarı test et</button> <button type="button" onclick="action(\'connections/delete-key\')">Kayıtlı anahtarı kaldır</button>':''}<p class="tooltip" style="margin-top:12px">Saklama: ${esc(c.key_storage)}.<br>Yalnızca resmi Extended hesap-ücreti okuma endpointine gönderilir. Windows şifrelemesi kullanılabiliyorsa şifreli saklanır; kullanılamıyorsa yalnızca motor belleğinde tutulur ve motor kapanınca silinir. Tarayıcı deposuna ve günlüğe yazılmaz. Stark/private key veya seed phrase girmeyin.</p>${c.account_fee?.taker!=null?`<p class="tooltip">Doğrulanan BTC taker ücreti: ${pct(c.account_fee.taker)} · ${ts(c.account_fee.ts)}. Paper ücret varsayımı otomatik düşürülmez.</p>`:''}</form>`:'<p class="tooltip">Bu public veri testi için API anahtarı girmenize gerek yok.</p>'}</div></section>`).join('')}</div>`}
async function testConnection(button){button.disabled=true;button.textContent='Bağlantı test ediliyor…';await action('connections/test',{venue:button.dataset.connection})}
function render(){if(!state){app.innerHTML='<div class="card empty"><h1>Gerçek veriler hazırlanıyor</h1><p class="muted">30 günlük mumlar, funding geçmişi ve emir defterleri okunuyor. İlk tarama yaklaşık bir dakika sürebilir.</p><p role="status">'+esc(notice)+'</p></div>';return}document.getElementById('connection').textContent='● GERÇEK VERİ / PAPER';app.innerHTML=({scanner,positions,settings,logs,connections}[tab]||scanner)();document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('active',a.dataset.page===tab));document.getElementById('config-form')?.addEventListener('submit',e=>{e.preventDefault();action('config',Object.fromEntries([...new FormData(e.target)].map(([k,v])=>[k,Number(v)])))});document.getElementById('symbols-form')?.addEventListener('submit',e=>{e.preventDefault();action('config',{symbols:new FormData(e.target).get('symbols').split(',').map(s=>s.trim().toUpperCase()).filter(Boolean)})});document.getElementById('extended-key-form')?.addEventListener('submit',e=>{e.preventDefault();const input=e.target.elements.key;const key=input.value;input.value='';action('connections/extended-key',{key})})}
async function refresh(){if(fetching)return;fetching=true;try{const r=await fetch('/api/state');if(!r.ok)throw Error('Sunucu yanıt vermiyor');const s=await r.json();if(!s.busy||s.config){state=s;if(!['settings','connections'].includes(tab)||!app.contains(document.activeElement))render()}else if(!state)render();document.getElementById('cycle-status').textContent=s.busy?'Tarama sürüyor…':'Son tarama: '+ts(state?.last_cycle)}catch(e){document.getElementById('connection').textContent='○ BAĞLANTI YOK';notice='Yerel motor bağlantısı yok. Otomatik tarama ve risk izlemesi durmuş olabilir.';render()}finally{fetching=false}}
document.querySelectorAll('nav a').forEach(a=>a.onclick=e=>{e.preventDefault();navigate(a.dataset.page)});window.addEventListener('hashchange',()=>{tab=location.hash.slice(1)||'scanner';render()});tab=location.hash.slice(1)||'scanner';render();refresh();setInterval(refresh,3000);
</script><script>function riskName(v){return state?.venue_labels?.[v]||v||'—'}
function historyPlot(points,fields,labels){if(!points?.length)return '<p class="tooltip">Eşlenmiş fiyat geçmişi henüz hazır değil.</p>';const values=points.flatMap(p=>fields.map(f=>p[f])).filter(Number.isFinite),lo=Math.min(...values),hi=Math.max(...values),range=hi-lo||1,W=650,H=200;return `<div style="padding:15px"><svg viewBox="0 0 720 240" style="width:100%;height:210px" role="img" aria-label="${esc(labels.join(' / '))}: gerçek eşlenmiş geçmiş fiyat serisi"><path d="M55 20H705 M55 110H705 M55 200H705" fill="none" stroke="#29343b"/><text x="0" y="26" fill="#819099" font-size="12">${hi.toFixed(3)}</text><text x="0" y="200" fill="#819099" font-size="12">${lo.toFixed(3)}</text>${fields.map((f,j)=>`<polyline fill="none" stroke="${j?'#b49cfc':'#a8f078'}" stroke-width="1.8" points="${points.map((p,i)=>(55+i/(points.length-1||1)*W).toFixed(2)+','+(200-(p[f]-lo)/range*180).toFixed(2)).join(' ')}"/>`).join('')}<text x="55" y="230" fill="#819099" font-size="11">${esc(ts(points[0].ts))}</text><text x="500" y="230" fill="#819099" font-size="11">${esc(ts(points[points.length-1].ts))}</text></svg><div class="tooltip">${labels.map((l,i)=>`<span style="color:${i?'#b49cfc':'#a8f078'}">● ${esc(l)}</span>`).join(' &nbsp; ')}</div></div>`}
function riskDetail(c){if(!c)return '<div class="card detail"><h2>İlk 5 çift hazırlanıyor</h2><p class="tooltip">Beş DEX verileri normalize ediliyor. Eksik platformlar sıralamada işlem adayı gibi gösterilmez.</p></div>';return `<div class="card detail" style="display:block"><div class="tiny">ÇİFT #${c.shortlist_rank} · RİSK MOTORU</div><h2 style="margin:12px 0">${esc(c.asset)}</h2><div class="legs"><div class="leg"><span class="direction">LONG</span><b>${esc(riskName(c.long))}</b><p>${pct(c.rate_long)} /1h</p></div><div class="leg"><span class="direction short">SHORT</span><b>${esc(riskName(c.short))}</b><p>${pct(c.rate_short)} /1h</p></div></div>${line('Normalize funding farkı',pct(c.funding_gap)+' /1h')}${line('Yönlü giriş mark spread’i',pct(c.price_spread),c.price_spread>=0?'good':'bad')}${line('Funding / spread sırası',c.funding_rank+' / '+c.spread_rank)}${line('Birleşik sıra puanı',Number(c.selection_score).toFixed(1))}${c.analysis?`${line('Korelasyon · 24s',c.analysis.corr24.toFixed(4))}${line('Korelasyon · 7g',c.analysis.corr7.toFixed(4))}${line('Hedge beta',c.analysis.beta.toFixed(4))}${line('Spread z-score',c.analysis.z.toFixed(3))}${line('Aleyhte spread stres oranı',pct(c.analysis.stress_fraction))}${line('Eşlenmiş 1h geçmiş',c.analysis.candles+' / 720')}`:'<div class="reason bad">30 günlük fiyat geçmişi doğrulaması tamamlanmadı.</div>'}${line('Gösterge ölçeği · hedef / bacak',money(c.reference_notional))}${line('Sabit oranla brüt funding¹',money(c.reference_funding))}${line('Bu ölçekte spread/teminat stresi¹',money(c.reference_stress))}${line('Funding / stres karşılama¹',c.reference_coverage==null?'—':pct(c.reference_coverage),c.reference_coverage>=1?'good':'bad')}<p class="tooltip">¹ Tahmin ufku boyunca oran sabitliği ve hedef miktarda gösterge hesabı. Gerçek ödeme veya net kâr değildir; ücretler dahil değildir.</p>${line('Riskle sınırlı notional / bacak',money(c.size))}${line('Muhafazakâr funding tahmini',money(c.conservative_funding))}${line('Giriş / çıkış ücretleri',c.entry_fee!=null?money(c.entry_fee+c.exit_fee):'Doğrulanmadı')}${line('Defter + gecikme kayması',money(c.execution_drag))}${line('Spread + teminat stresi',money(c.stress_loss))}${line('Stres sonrası net',money(c.net),c.net>0?'good':'bad')}<div class="reason ${c.eligible?'':'bad'}">${c.eligible?'✓ Tüm kontroller geçti; paper giriş öncesi tekrar defter kontrolü yapılır.':esc((c.reasons||[]).join(' · '))}</div><p class="tooltip">Long oran kaynağı: ${esc(c.rate_basis_long)}.<br>Short oran kaynağı: ${esc(c.rate_basis_short)}.</p>${line('Sonraki long ödemesi',ts(c.next_long))}${line('Sonraki short ödemesi',ts(c.next_short))}<p class="tooltip">Pozitif mark spread’i short bacağın daha pahalı olduğunu gösterir; gerçekleşebilir giriş kârı sayılmaz. Defter VWAP maliyeti risk aşamasında ayrıca ölçülür. Yüksek korelasyon tek başına onay değildir.</p></div>`}
scanner=function(){const list=state.candidates,c=list.find(x=>x.asset===selectedAsset&&x.long===selectedLong)||list[0];return head('İlk 5 çift · fiyat uyumu ve risk','TxFlow · RISEx · Arcus · Extended · Lighter Robinhood Chain')+stats()+`<div class="card" style="margin-bottom:18px"><div style="padding:18px"><span class="tag">15 VARLIK</span> <span class="tag">5 DEX</span> <span class="tag">${state.selection?.universe||0} POZİTİF FUNDING ADAYI</span> <span class="tag warn">İLK ${list.length} ÇİFT DERİN ANALİZ</span><p class="tooltip" style="margin-top:12px">${esc(state.selection?.method)}<br>Son tamamlanan tarama: ${ts(state.last_cycle)} · turlar arası ${state.config.poll_seconds} sn. Negatif giriş spread’i avantaj olarak ödüllendirilmez.</p></div></div><div class="layout"><div><div class="card"><div class="card-head"><h2>Önce fırsat, sonra bağımsız risk kontrolü</h2></div><div class="table-wrap"><table><thead><tr><th># / VARLIK</th><th>LONG → SHORT</th><th>FUNDING / 1H</th><th>MARK SPREAD</th><th>24S / 7G UYUM</th><th>KARAR</th></tr></thead><tbody>${list.map((r,i)=>`<tr class="${r===c?'selected':''}" tabindex="0" onclick="selectCandidate(${i})" onkeydown="if(event.key==='Enter')selectCandidate(${i})"><td><span class="muted">#${r.shortlist_rank}</span> <b>${esc(r.asset)}</b></td><td>${esc(riskName(r.long))}<div class="tooltip">→ ${esc(riskName(r.short))}</div></td><td class="mono good">${pct(r.funding_gap)}</td><td class="mono ${r.price_spread>=0?'good':'bad'}">${pct(r.price_spread)}</td><td class="mono">${r.analysis?r.analysis.corr24.toFixed(3)+' / '+r.analysis.corr7.toFixed(3):'Veri eksik'}</td><td><span class="tag ${r.eligible?'':'warn'}">${r.eligible?'Paper adayı':'Reddedildi / bekle'}</span><div class="tooltip" style="white-space:normal;max-width:230px">${esc((r.reasons||[])[0]||'Girişte yeniden doğrulanır')}</div></td></tr>`).join('')}</tbody></table>${list.length?'':'<div class="empty">Beş platformdaki ortak varlıklar taranıyor.</div>'}</div></div><div class="card" style="margin-top:18px"><div class="card-head"><h2>${c?esc(c.asset)+' · '+esc(riskName(c.long))+' / '+esc(riskName(c.short)):'Seçili çift'} · fiyat hareketi</h2><span class="tag warn">7 GÜN / 1H</span></div><p class="tooltip" style="padding:15px 18px 0">İlk ortak kapanış = 100. Getiri uyumu gerçek fiyat farkını ortadan kaldırmaz.${c?.price_types?' Fiyat kaynakları: '+esc(Object.entries(c.price_types).map(([v,t])=>riskName(v)+': '+t).join(' / ')):''}</p>${historyPlot(c?.history,['long_index','short_index'],c?[riskName(c.long),riskName(c.short)]:[])}</div><div class="card" style="margin-top:18px"><div class="card-head"><h2>İki DEX arasındaki fiyat farkı</h2></div>${historyPlot(c?.history?.map(p=>({...p,spread_pct:p.spread*100})),['spread_pct'],['(Long − Short) / ortalama fiyat · %'])}</div></div>${riskDetail(c)}</div>`+venues()};
const originalFiveSettings=settings;settings=function(){return originalFiveSettings().replace('İlk sermaye iki platforma eşit ayrılır.','İlk sermaye beş platforma eşit ayrılır.').replace('Lighter taker','Lighter Robinhood taker').replace('USD/USDC','USD/USDC/USDG')};
const originalFiveConnections=connections;connections=function(){return originalFiveConnections().replace('Tarama listesi · 15 varlık / 30 yön','Tarama listesi · 15 varlık / 5 DEX / ilk 5 çift').replaceAll('15 ortak perpetual varlık','15 perpetual varlık (en az iki DEX üzerinde)').replace('Paper motoru şu an Lighter ↔ Extended çiftlerini kullanır. Diğer bağlantılar veri erişimi kontrolüdür.','Risk taraması beş DEX arasında yapılır. Paper yürütme yalnızca doğrulanmış Lighter RH ↔ Extended çiftinde açık; diğer çiftlerde doğrulama eksikleri giriş engelidir.').replaceAll('<h2>Lighter</h2>','<h2>Lighter RH</h2>')};
const originalFiveVenues=venues;venues=function(){return originalFiveVenues().replaceAll('<b>Lighter</b>','<b>Lighter RH</b>')};
render();
</script><script>// Neutralbasis terminal: source-backed screeners and explicit historical model costs.
const hc={period:8,view:'list',query:'',venue:'all',sort:'funding',positive:false,favorites:false,above:false,expanded:null,size:1000,help:false,days:7,bt:null,btBusy:false,btError:'',btForm:{asset:'BTC',long:'Extended',short:'Lighter',size:1000,slippage_bps:2,include_price:true,fee_bps:{TxFlow:5,RISEx:5}}};
// One-time carry-over of saved favorites, filters and theme from the old herdcall name.
try{for(const k of ['favorites','presets','theme']){const old='herdcall.'+k,v=localStorage.getItem(old);if(v!==null&&localStorage.getItem('neutralbasis.'+k)===null)localStorage.setItem('neutralbasis.'+k,v);localStorage.removeItem(old)}}catch{}
try{hc.stars=new Set(JSON.parse(localStorage.getItem('neutralbasis.favorites')||'[]'))}catch{hc.stars=new Set()}
let hcVenues=['TxFlow','RISEx','Arcus','Extended','Lighter'];
const fmtPrice=x=>x==null?'—':Number(x).toLocaleString('en-US',{maximumFractionDigits:x<1?7:x<100?4:2});
const signedMoney=x=>x==null?'—':(x>0?'+':'')+money(x);
const color=x=>x==null?'muted':x>=0?'good':'bad';
const periodLabel=()=>hc.period===8760?'APR':hc.period+'H';
const rate=x=>x==null?'—':(x>0?'+':'')+(x*hc.period*100).toFixed(hc.period===8760?2:4)+'%';
const viewData=()=>state?.market_view||{markets:[],pairs:[]};
const pairKey=p=>[p.asset,p.long,p.short].join(':');
const name=v=>state?.venue_labels?.[v]||v;
function hcSet(k,v){hc[k]=v;if(k!=='expanded')hc.expanded=null;render()}
function star(key){hc.stars.has(key)?hc.stars.delete(key):hc.stars.add(key);localStorage.setItem('neutralbasis.favorites',JSON.stringify([...hc.stars]));render()}
function hcQuery(input){const pos=input.selectionStart;hc.query=input.value;render();const next=document.getElementById('pair-search');if(next){next.focus();next.setSelectionRange(pos,pos)}}
function favorite(p){const k=pairKey(p);return `<button class="fav ${hc.stars.has(k)?'on':''}" aria-label="${esc(p.asset+' '+name(p.long)+' '+name(p.short))} favori" onclick="event.stopPropagation();star('${k}')">${hc.stars.has(k)?'★':'☆'}</button>`}
function assetCell(a){return `<div class="asset-cell"><span class="asset-mark">${esc(a.slice(0,1))}</span><div><b>${esc(a)}</b><small>PERP / PERP</small></div></div>`}
function venueLeg(v,side,price){return `<div class="pair-leg"><span class="side ${side==='L'?'good':'bad'}">${side}</span><span class="venue-icon">${esc(v.slice(0,1))}</span>${esc(name(v))}${price!=null?`<span class="price">${fmtPrice(price)}</span>`:''}</div>`}
function spark(points,field='spread'){if(!points?.length)return '<span class="muted">—</span>';const xs=points.map(p=>p[field]),low=Math.min(...xs),range=Math.max(...xs)-low||1;return `<svg class="spark" viewBox="0 0 105 27" aria-label="Gerçek spread geçmişi"><polyline fill="none" stroke="#b9c7b0" stroke-width="1.1" points="${xs.map((x,i)=>(i/(xs.length-1||1)*105).toFixed(1)+','+(24-(x-low)/range*21).toFixed(1)).join(' ')}"/></svg>`}
function plot(points,fields,labels,colors,mode='line',units='$'){
 if(!points?.length)return '<div class="plot-empty">Bu çift için doğrulanmış geçmiş henüz hazır değil.</div>';
 const values=points.flatMap(p=>fields.map(f=>p[f])).filter(Number.isFinite),lo=Math.min(0,...values),hi=Math.max(0,...values),range=hi-lo||1;const X=i=>40+i/(points.length-1||1)*890,Y=x=>235-(x-lo)/range*210,zero=Y(0);
 return `<div class="plot-wrap"><div class="legend">${labels.map((x,i)=>`<span><i style="background:${colors[i]}"></i>${esc(x)}</span>`).join('')}</div><svg class="plot" viewBox="0 0 1000 265" role="img" aria-label="${esc(labels.join(', '))}">${[0,.25,.5,.75,1].map(f=>`<line class="chart-gridline" x1="40" y1="${25+210*f}" x2="930" y2="${25+210*f}"/><text x="940" y="${29+210*f}">${units}${(hi-range*f).toFixed(units==='%'?3:2)}</text>`).join('')}${[0,.25,.5,.75,1].map(f=>`<line class="chart-gridline" x1="${40+890*f}" y1="25" x2="${40+890*f}" y2="235"/>`).join('')}<line x1="40" x2="930" y1="${zero}" y2="${zero}" stroke="#44513f" stroke-dasharray="2 3"/>${fields.map((f,j)=>mode==='bar'?points.map((p,i)=>`<rect x="${X(i)}" y="${Math.min(zero,Y(p[f]))}" width="${Math.max(1,850/points.length)}" height="${Math.max(.5,Math.abs(Y(p[f])-zero))}" fill="${p[f]>=0?'#32c98a':'#ea5370'}" opacity=".75"/>`).join(''):`<polyline fill="none" stroke="${colors[j]}" stroke-width="1.5" points="${points.map((p,i)=>X(i).toFixed(1)+','+Y(p[f]).toFixed(1)).join(' ')}"/>`).join('')}<text x="40" y="258">${esc(new Date(points[0].ts*1000).toLocaleDateString('tr-TR'))}</text><text x="850" y="258">${esc(new Date(points[points.length-1].ts*1000).toLocaleDateString('tr-TR'))}</text></svg></div>`}
function periods(){return `<div class="segmented" aria-label="Funding dönemi">${[1,8,24,8760].map(x=>`<button class="${hc.period===x?'active':''}" onclick="hcSet('period',${x})">${x===8760?'APR':x+'H'}</button>`).join('')}</div>`}
function commonFilters(price=false){return `<div class="toolbar"><div class="toolbar-left"><button onclick="hcSet('help',!hc.help)">☷ Filtreler</button><span class="screener-count">${state.config.symbols.length} varlık · 5 DEX</span><div class="segmented"><button class="${!hc.positive&&!hc.favorites&&!hc.above?'active':''}" onclick="hc.positive=false;hc.favorites=false;hc.above=false;render()">Tümü</button><button class="${hc.positive?'active':''}" onclick="hcSet('positive',!hc.positive)">${price?'Pozitif fiyat farkı':'Pozitif funding'}</button>${price?`<button class="${hc.above?'active':''}" onclick="hcSet('above',!hc.above)">Ortalamadan geniş</button>`:''}<button class="${hc.favorites?'active':''}" onclick="hcSet('favorites',!hc.favorites)">★ Favoriler</button></div></div><div class="rate-control">${periods()}<select aria-label="DEX filtresi" onchange="hcSet('venue',this.value)"><option value="all">Tüm DEX’ler</option>${hcVenues.map(v=>`<option value="${v}" ${hc.venue===v?'selected':''}>${name(v)}</option>`).join('')}</select></div></div>${hc.help?`<div class="help-box">Funding oranları 1 saat tabanına normalize edilmiştir; seçili dönem yalnızca gösterim çarpanıdır. APR bileşiksiz, anlık oranın yıllık gösterimidir. Fiyat tablosundaki net gösterge, 7 günlük spread ortalamasına dönüş eksi ücretlerdir; defter kayması ve funding hariçtir. Geçmiş veya ücret yoksa net hesaplanmaz. Paper giriş kararı ayrıca tüm risk kontrollerini geçmelidir.</div>`:''}`}
function filteredPairs(price){let ps=viewData().pairs.map(p=>{if(price)return {...p};if(p.funding==null||p.funding>=0)return {...p};return {...p,long:p.short,short:p.long,long_price:p.short_price,short_price:p.long_price,funding:-p.funding,spread:-p.spread,history:p.history?{...p.history,mean:-p.history.mean,points:p.history.points.map(x=>({...x,spread:-x.spread}))}:null}});ps=ps.map(p=>{const c=state.candidates.find(c=>c.asset===p.asset&&c.long===p.long&&c.short===p.short);return {...p,deep:!!c,eligible:!!c?.eligible,reason:c?(c.reasons||[])[0]||'Kontroller geçti':p.reason}});ps=ps.filter(p=>(!hc.query||[p.asset,p.long,p.short,name(p.long),name(p.short)].join(' ').toLowerCase().includes(hc.query.toLowerCase()))&&(hc.venue==='all'||[p.long,p.short].includes(hc.venue))&&(!hc.favorites||hc.stars.has(pairKey(p)))&&(!hc.positive||(price?p.spread>0:p.funding>0))&&(!hc.above||p.history&&p.spread>p.history.mean));return ps.sort((a,b)=>hc.sort==='asset'?a.asset.localeCompare(b.asset):hc.sort==='net'?(netEstimate(b,price)??-Infinity)-(netEstimate(a,price)??-Infinity):price?b.spread-a.spread:(b.funding??-Infinity)-(a.funding??-Infinity))}
function netEstimate(p,price){if(p.fee_roundtrip==null||price&&!p.history)return null;return hc.size*((price?p.spread-p.history.mean:(p.funding??0)*state.config.horizon)-p.fee_roundtrip)}
function pairDrawer(p,price){const deep=state.candidates.find(c=>c.asset===p.asset&&[c.long,c.short].every(v=>[p.long,p.short].includes(v)));return `<tr><td colspan="10" style="padding:0;white-space:normal"><div class="drawer"><div class="drawer-grid"><div><h2>${esc(p.asset)} · ${esc(name(p.long))} / ${esc(name(p.short))}</h2><p class="tooltip">Fiyat farkı · (Short / Long) logaritması · gerçek eşlenmiş 1h kapanışlar</p>${plot(p.history?.points.map(x=>({...x,spread:x.spread*100})),['spread'],['Spread · %'],['#a8c697'],'line','%')}</div><div>${line('Anlık fiyat farkı',pct(p.spread))}${line('7 günlük ortalama',pct(p.history?.mean))}${line('Sıfır çevresinde kesişim · 7g',p.history?.crossings??'Veri bekleniyor')}${line('Gidiş / dönüş ücret göstergesi',p.fee_roundtrip==null?'Tarife gerekli':money(hc.size*p.fee_roundtrip))}${line('Ücret sonrası gösterge',money(netEstimate(p,price)))}<p class="tooltip">Gösterge bacak başına ${money(hc.size)} ölçeğindedir. Defter kayması ve stres dahil değildir; gerçekleşebilir net kâr sayılmaz.</p><div class="reason ${deep?.eligible?'':'bad'}">${esc(deep?(deep.reasons||[]).join(' · ')||'Funding risk kontrolleri geçti.':p.reason)}</div><button class="primary" onclick="openBacktest('${p.asset}','${p.long}','${p.short}')">Bu çifti backtest et ↗</button> <button onclick="navigate('scanner')">Derin risk analizi</button></div></div></div></td></tr>`}
function screener(price=false){const ps=filteredPairs(price);return head(price?'Fiyat arbitrajı':'Funding oranları',price?'Ucuz DEX’te long, pahalıda short. Spread’in geçmişe göre açılmasını ve yakınsama potansiyelini karşılaştır.':'Beş DEX üzerinde normalize oranlar. Funding farkını, fiyat etkisini ve maliyeti birlikte değerlendir.')+`<div class="filters"><div class="segmented"><button class="${!price&&hc.view==='list'?'active':''}" onclick="hcSet('view','list')">${price?'Perp + perp':'En iyi çiftler'}</button>${!price?`<button class="${hc.view==='matrix'?'active':''}" onclick="hcSet('view','matrix')">DEX matrisi</button>`:''}</div><span class="tooltip">${price?'Net gösterge: 7g ortalamaya dönüş − 4 emrin ücretleri':'Anlık oranlar · '+periodLabel()+' gösterimi'}</span></div>`+commonFilters(price)+(!price&&hc.view==='matrix'?fundingMatrix():`<div class="toolbar" style="border-top:0;padding-top:0"><span class="screener-count">${ps.length} çift <span class="muted">/ tüm tarama evreni</span></span><div class="rate-control"><input id="pair-search" class="search" aria-label="Çift tablosunda ara" placeholder="Varlık veya DEX ara" value="${esc(hc.query)}" oninput="hcQuery(this)"><label class="inline-label">Bacak / USD<input aria-label="Gösterge bacak büyüklüğü" type="number" min="10" max="1000000" value="${hc.size}" onchange="hcSet('size',Math.max(10,Math.min(1000000,Number(this.value)||1000)))"></label><select aria-label="Sıralama" onchange="hcSet('sort',this.value)"><option value="funding" ${hc.sort==='funding'?'selected':''}>${price?'Fiyat farkı ↓':'Funding farkı ↓'}</option><option value="net" ${hc.sort==='net'?'selected':''}>Ücret sonrası gösterge ↓</option><option value="asset" ${hc.sort==='asset'?'selected':''}>Varlık A–Z</option></select></div></div><div class="table-wrap"><table aria-label="${price?'Fiyat arbitrajı':'Funding çiftleri'}"><thead><tr><th></th><th>VARLIK</th><th>LONG / SHORT</th><th class="num">${price?'FİYAT FARKI':'FUNDING / '+periodLabel()}</th><th num mono">${money(p.min_volume)}<div class="cell-sub">OI ${money(p.min_oi)}</div></td>`:''}${col('leverage')?`<td class="num mono">${p.leverage?p.leverage+'x':'—'}</td>`:''}${col('paid')?`<td class="num mono">${wpct(p.paid24)}<div class="cell-sub">${wpct(p.paid7)}</div></td>`:''}${col('interval')?`<td class="mono">${intervalLabel(p.long_interval)} / ${intervalLabel(p.short_interval)}</td>`:''}${col('trend')?`<td>${spark(p.history?.points)}</td>`:''}${col('risk')?`<td><span class="tag ${deep?.eligible?'':'warn'}">${deep?(deep.eligible?'Funding adayı':'Bekle'):'Veri taraması'}</span></td>`:''}<td>▾</td></tr>${hc.expanded===key?wideDrawer(p):''}`}).join('')}</tbody></table>${ps.length?'':'<div class="empty"><h2>Bu koşullarda doğrulanmış çift yok</h2><p>Bağlantı kapsamını ve eksik veri durumlarını Borsalar ekranından görebilirsin.</p><button onclick="resetFilters()">Filtreleri temizle</button></div>'}</div><div class="toolbar"><span class="tooltip">¹ Gösterge hesabı. Gelecek funding, kayma, likidasyon ve stres kesin getirisi değildir. USD/USDT/USDC/USDG 1:1 varsayılır.</span>${hc.total>hc.limit?'<button onclick="hc.limit+=100;render()">100 çift daha göster ↓</button>':''}</div>`)};

async function requestRead(kind,asset,long,short,long_kind){try{hc.readJobs[kind]={status:'running'};render();const resp=await fetch('/api/'+kind,{method:'POST',headers:{'Content-Type':'application/json','X-Paper-Token':window.paperToken},body:JSON.stringify({asset,long,short,long_kind,size:hc.size})});const r=await resp.json();if(!resp.ok)throw Error(r.error);pollReads(kind)}catch(e){hc.readJobs[kind]={status:'error',error:e.message};render()}}

function paperChartEvents(p){if(p.long_kind==='spot')return [];const out=[];for(const pos of [...state.positions,...state.closed]){if(pos.asset!==p.asset||pos.legs?.length!==2)continue;const l=pos.legs.find(x=>x.venue===p.long),s=pos.legs.find(x=>x.venue===p.short);if(!l||!s)continue;
 if(l.entry>0&&s.entry>0)out.push({ts:Math.max(l.entered,s.entered),long_price:l.entry,short_price:s.entry,spread:Math.log(s.entry/l.entry)*100,label:'Paper açılış',color:'#38cf9d',id:pos.id});
 if(l.closed&&s.closed&&l.exit>0&&s.exit>0)out.push({ts:Math.max(l.exited,s.exited),long_price:l.exit,short_price:s.exit,spread:Math.log(s.exit/l.exit)*100,label:'Paper kapanış',color:'#f2b766',id:pos.id});}return out}
function pairChartSvg(points,fields,labels,colors,events,levels=[],unit='$'){
 if(!points?.length)return '<div class="plot-empty">Gerçek eşlenmiş fiyat geçmişi hazırlanmadı. Geçmişi getir düğmesini kullanın.</div>';
 const first=points[0].ts,last=Math.max(points[points.length-1].ts,...events.map(e=>e.ts)),visible=events.filter(e=>e.ts>=first&&e.ts<=last),values=[...points.flatMap(p=>fields.map(f=>p[f])),...visible.flatMap(p=>fields.map(f=>p[f])),...levels.map(l=>l.value)].filter(Number.isFinite);if(!values.length)return '<div class="plot-empty">İki fiyat serisi için geçmişi yenileyin.</div>';
 const min=Math.min(...values),max=Math.max(...values),pad=Math.max((max-min)*.12,Math.abs(max)*.00001,1e-8),lo=min-pad,hi=max+pad,X=t=>48+(t-first)/(last-first||1)*830,Y=v=>220-(v-lo)/(hi-lo)*196,fmt=v=>unit==='%'?v.toFixed(3)+'%':v.toLocaleString('en-US',{maximumFractionDigits:v<1?6:2}),date=t=>new Date(t*1000).toLocaleString('tr-TR',{timeZone:'Europe/Istanbul'});
 const svg=`<svg class="plot" viewBox="0 0 1000 260" role="img" aria-label="${esc(labels.join(' / '))}">${[0,.25,.5,.75,1].map(f=>`<line class="chart-gridline" x1="48" x2="878" y1="${24+196*f}" y2="${24+196*f}"/><text x="890" y="${28+196*f}">${esc(fmt(hi-(hi-lo)*f))}</text>`).join('')}${levels.map(l=>`<line x1="48" x2="878" y1="${Y(l.value)}" y2="${Y(l.value)}" stroke="${l.color}" stroke-dasharray="5 5"><title>${esc(l.label)}: ${fmt(l.value)}</title></line>`).join('')}${fields.map((f,i)=>`<polyline fill="none" stroke="${colors[i]}" stroke-width="2" points="${points.map(p=>X(p.ts).toFixed(2)+','+Y(p[f]).toFixed(2)).join(' ')}"/>${points.map(p=>`<circle cx="${X(p.ts)}" cy="${Y(p[f])}" r="4" fill="transparent"><title>${esc(labels[i])} · ${date(p.ts)} · ${fmt(p[f])}</title></circle>`).join('')}`).join('')}${visible.map(e=>`<line x1="${X(e.ts)}" x2="${X(e.ts)}" y1="24" y2="220" stroke="${e.color}" stroke-dasharray="2 4"/>${fields.map(f=>`<circle cx="${X(e.ts)}" cy="${Y(e[f])}" r="5" fill="${e.color}" stroke="#101411"><title>${esc(e.label)} · ${date(e.ts)} · ${fmt(e[f])} · ${esc(e.id)}</title></circle>`).join('')}`).join('')}<text x="48" y="250">${esc(date(first))}</text><text x="640" y="250">${esc(date(last))}</text></svg>`;
 return `<div class="plot-wrap"><div class="legend">${labels.map((l,i)=>`<span><i style="background:${colors[i]}"></i>${esc(l)}</span>`).join('')}${levels.map(l=>`<span><i style="background:${l.color}"></i>${esc(l.label)} ${fmt(l.value)}</span>`).join('')}${visible.length?'<span>● Paper açılış / kapanış</span>':''}</div>${svg}</div>`
}
function pairPriceCharts(p){const h=pairHistory(p),points=h?.points?.filter(x=>Number.isFinite(x.long_price)&&Number.isFinite(x.short_price)),events=paperChartEvents(p),levels=h?[{value:0,label:'Sıfır',color:'#59635b'},{value:h.mean*100,label:'7g ortalama',color:'#ac9be6'},{value:Math.max(.0005,h.mean+h.sd)*100,label:'Giriş sinyali ≥',color:'#e3b86e'},{value:.02,label:'Çıkış sinyali ≤',color:'#63c8b4'}]:[];return `<div class="pair-price-charts"><h3>İki borsada fiyat hareketi · 7 gün</h3>${pairChartSvg(points,['long_price','short_price'],[name(p.long),name(p.short)],['#58b9ed','#eda575'],events)}<h3>Fiyat farkı ve yakınsama eşikleri</h3>${pairChartSvg(points?.map(x=>({...x,spread:x.spread*100})),['spread'],['log(Short / Long) · %'],['#a8c697'],events,levels,'%')}<p class="tooltip">Gerçek eşlenmiş 1 saatlik işlem kapanışları · UTC+3. Noktanın üzerine gelince zaman ve fiyat görünür. Kesikli çizgiler sinyal eşikleridir; giriş için masraf ve risk onayı, çıkış için net kazanç koşulu ayrıca aranır. Eşikler Lighter RH–Extended yakınsama modelini referans alır. ${events.length?'İşaretler gerçek paper dolum zaman ve fiyatlarıdır; saatlik mumlardan türetilmez.':'Bu çift için kayıtlı paper açılış/kapanış işareti yok.'}</p></div>`}
